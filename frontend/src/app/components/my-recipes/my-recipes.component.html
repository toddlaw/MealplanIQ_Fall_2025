<div class="wrap">
    <h1>My Recipes</h1>

    <mat-card class="list-card">
        <ng-container *ngIf="(authorized$ | async)">

            <!-- Only: Add New -->
            <div class="actions-row">
                <button mat-raised-button color="primary" (click)="addNew()">
                    <mat-icon>add</mat-icon>
                    Add New Recipe
                </button>
            </div>

            <ng-container *ngIf="(recipes$ | async) as recipes; else loading">
                <ng-container *ngIf="recipes.length; else empty">
                    <mat-list>
                        <mat-list-item *ngFor="let r of recipes; trackBy: trackById">
                            <div class="row">
                                <div class="title">{{ r.title }}</div>
                                <div class="actions">
                                    <button mat-stroked-button color="primary" (click)="edit(r)">
                                        <mat-icon>edit</mat-icon>
                                        <span class="btn-text">Edit</span>
                                    </button>
                                    <button mat-stroked-button color="warn" (click)="delete(r)">
                                        <mat-icon>delete</mat-icon>
                                        <span class="btn-text">Delete</span>
                                    </button>
                                </div>
                            </div>
                        </mat-list-item>
                    </mat-list>
                </ng-container>
            </ng-container>

            <ng-template #loading>
                <div class="muted">Loading recipes…</div>
            </ng-template>

            <ng-template #empty>
                <div class="empty">
                    <p>No recipes yet.</p>
                    <button mat-raised-button color="primary" (click)="addNew()">
                        <mat-icon>add</mat-icon>
                        Create one
                    </button>
                </div>
            </ng-template>

        </ng-container>
    </mat-card>
</div>
